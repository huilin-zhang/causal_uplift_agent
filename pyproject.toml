[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift-agent"
version = "0.1.0"
description = "Uplift modeling and a LangGraph agent for customer retention offers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "econml>=0.15",
  "pyyaml>=6",
  "langgraph>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "joblib>=1.4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "matplotlib>=3.8"]
mlops = ["mlflow>=3.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "pipelines*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs real datasets or a long run"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["artifacts", "data", "docs/manual"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
