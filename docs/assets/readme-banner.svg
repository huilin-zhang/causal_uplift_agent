          <path d="M21 29L25 22" stroke="#85A5BF" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <text x="249" y="174" font-size="14" font-weight="600" fill="#B3CDE1">Sleeping dogs</text>
        <text x="208" y="210" font-size="11" fill="#88ABC9">Leave because of offer</text>
