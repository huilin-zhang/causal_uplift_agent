<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Causal Uplift Agent</title>
  <desc id="desc">A compact blue banner asks Who will an offer help? on one line with a blue-to-yellow gradient. Four small cartoon icons illustrate conceptual retention response types: Persuadables smile while receiving a discount offer; Sure things smile with a heart and thumbs-up; Lost causes are expressionless with folded arms; Sleeping dogs frown and reject a crossed-out offer. Captions explain each response. The four cells remain visually secondary to the title.</desc>
  <defs>
    <linearGradient id="title-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7DD3FC"/><stop offset="0.55" stop-color="#BFDBFE"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0B355D"/>
    <g stroke="#FFFFFF" stroke-opacity="0.055" fill="none">
      <path d="M0 80H1200 M0 160H1200 M0 240H1200"/>
      <path d="M800 0V300 M900 0V300 M1000 0V300 M1100 0V300"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="48" y="44" width="210" height="28" rx="14" fill="#174B78"/>
      <circle cx="64" cy="58" r="3" fill="#FACC15"/>
      <text x="77" y="62" font-size="11" font-weight="600" letter-spacing="1.4" fill="#FDE68A">CAUSAL UPLIFT AGENT</text>
      <text x="48" y="147" font-size="44" font-weight="700" letter-spacing="-0.8" fill="#FFFFFF">Who will an <tspan fill="url(#title-accent)">offer help?</tspan></text>
      <text x="50" y="193" font-size="18" fill="#E0F2FE">Retention offers guided by treatment effects.</text>
      <text x="50" y="232" font-size="12" font-weight="500" fill="#BAE6FD">PYTHON / LANGGRAPH / ECONML / MLFLOW / FASTAPI</text>
      <g transform="translate(756 38)">
        <rect x="0" y="42" width="178" height="84" rx="8" fill="#103B63" stroke="#8B824A" stroke-width="1"/>
        <g class="customer-avatar" data-type="persuadables" transform="translate(7 52)">
          <path d="M2 34C2 26 6 24 13 24S24 26 24 34" fill="#3E6483"/>
          <rect x="10" y="20" width="6" height="6" rx="2" fill="#D5C391"/>
          <circle cx="13" cy="13" r="9" fill="#D5C391"/>
          <path d="M4 12C2 3 8 1 14 3C22 1 25 8 22 14L20 8Q15 10 12 6Q8 11 4 12" fill="#244D70"/>
