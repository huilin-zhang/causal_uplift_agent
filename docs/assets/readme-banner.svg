          <path d="M4 12C2 3 8 1 14 3C22 1 25 8 22 14L20 8Q15 10 12 6Q8 11 4 12" fill="#244D70"/>
          <path d="M7 13H10M16 13H19M10 19H16" stroke="#153858" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M5 27L21 32M21 27L5 32" stroke="#244D70" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M5 27L21 32M21 27L5 32" stroke="#85A5BF" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="55" y="174" font-size="14" font-weight="600" fill="#B3CDE1">Lost causes</text>
        <text x="14" y="210" font-size="11" fill="#88ABC9">Leave either way</text>
        <rect x="194" y="142" width="178" height="84" rx="8" fill="#103B63" stroke="#285477" stroke-width="1"/>
        <g class="customer-avatar" data-type="sleeping-dogs" transform="translate(201 152)">
          <path d="M2 34C2 26 6 24 13 24S24 26 24 34" fill="#3E6483"/>
          <rect x="10" y="20" width="6" height="6" rx="2" fill="#85A5BF"/>
          <circle cx="13" cy="13" r="9" fill="#85A5BF"/>
          <path d="M4 12C2 3 8 1 14 3C22 1 25 8 22 14L20 8Q15 10 12 6Q8 11 4 12" fill="#244D70"/>
          <path d="M8 13V14M18 13V14" stroke="#153858" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M7 9L10 11M16 11L19 9M9 20Q13 16 17 20" stroke="#153858" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M28 19H39V31H28L25 25Z" fill="#557E9F"/>
