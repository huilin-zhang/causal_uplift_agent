          <path d="M21 28L30 23" stroke="#D5C391" stroke-width="4" stroke-linecap="round"/>
          <path d="M27 15H39V28H27L24 22Z" fill="#D9C681"/>
          <circle cx="27" cy="22" r="1" fill="#103B63"/>
          <text x="30" y="24" font-size="8" font-weight="700" fill="#103B63">%</text>
        </g>
        <text x="55" y="74" font-size="14" font-weight="600" fill="#E8DFAF">Persuadables</text>
        <text x="14" y="110" font-size="11" fill="#88ABC9">Stay only with offer</text>
        <rect x="194" y="42" width="178" height="84" rx="8" fill="#103B63" stroke="#285477" stroke-width="1"/>
        <g class="customer-avatar" data-type="sure-things" transform="translate(201 52)">
